<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PragyaCalls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📞 PragyaCalls</h1>
        <p class="subtitle">स्मार्ट कॉलिंग एडमिनिस्ट्रेटर</p>
        
        <div class="dialer-box">
            <input type="text" id="phoneInput" placeholder="नंबर दर्ज करें..." />
            <div class="btn-group">
                <button class="call-btn" onclick="makeCall()">कॉल करें</button>
                <button class="clear-btn" onclick="clearInput()">साफ करें</button>
            </div>
        </div>
    </div>

    <script>
        function makeCall() {
            let num = document.getElementById('phoneInput').value;
            if(num) {
                window.location.href = 'tel:' + num;
            } else {
                alert('कृपया पहले नंबर डालें!');
            }
        }
        function clearInput() {
            document.getElementById('phoneInput').value = '';
        }
    </script>
</body>
</html>
